<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="borderSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="screenDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
    <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.05   0 0 0 0 0.08   0 0 0 0 0.15  0 0 0 0.3 0"/>
    </filter>
  </defs>

  <!-- Ground Ambient Shadows -->
  <ellipse cx="260" cy="1180" rx="220" ry="40" filter="url(#contactShadow)"/>
  <ellipse cx="650" cy="1220" rx="240" ry="45" filter="url(#contactShadow)"/>

  <!-- ================= LEFT / BACKGROUND PHONE (Admin Panel) ================= -->
  <g transform="matrix(0.92, 0.16, -0.15, 0.94, 110, 10)" filter="url(#softShadow)">
    <!-- Phone Outer Shell -->
    <rect x="0" y="0" width="370" height="740" rx="46" fill="url(#borderSilver)"/>
    <rect x="5" y="5" width="360" height="730" rx="42" fill="#0b0f19"/>
    <!-- Screen -->
    <rect x="12" y="12" width="346" height="716" rx="36" fill="url(#screenDark)"/>
    
    <!-- Dynamic Island -->
    <rect x="135" y="22" width="100" height="26" rx="13" fill="#000000"/>

    <!-- Status Bar -->
    <text x="36" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">21:01</text>
    <circle cx="316" cy="35" r="4" fill="#ffffff"/>
    <rect x="325" y="30" width="18" height="10" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/>

    <!-- App Bar -->
    <rect x="24" y="60" width="140" height="28" rx="8" fill="#4f46e5"/>
    <text x="34" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">← Powrót do Strony Gł...</text>
    <text x="175" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Pan...</text>
    <circle cx="314" cy="74" r="14" fill="#6366f1"/>
    <text x="314" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AN</text>

    <!-- Card 1: Liczba obecnych -->
    <rect x="24" y="104" width="150" height="70" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="44" cy="124" r="8" fill="#065f46"/>
    <text x="60" y="127" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Liczba obecnych</text>
    <text x="44" y="156" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800">3</text>
    <text x="64" y="154" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">Aktualnie w pracy</text>

    <!-- Card 2: Absencje -->
    <rect x="186" y="104" width="150" height="70" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="218" y="127" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Absencje</text>
    <text x="206" y="156" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800">0</text>
    <text x="226" y="154" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">Zatwierdzone dzisiaj</text>

    <!-- Card 3: Wykres Obecność per dział -->
    <rect x="24" y="186" width="312" height="96" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="36" y="206" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Obecność per dział (Kliknij na słupek)</text>
    <!-- Chart Bars -->
    <rect x="70" y="222" width="70" height="34" rx="4" fill="#2563eb"/>
    <text x="105" y="217" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" text-anchor="middle">3</text>
    <text x="105" y="268" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" text-anchor="middle">Wszystkie</text>

    <rect x="190" y="238" width="60" height="18" rx="4" fill="#10b981"/>
    <text x="220" y="233" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" text-anchor="middle">1</text>
    <text x="220" y="268" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" text-anchor="middle">Sala</text>

    <!-- Menu Section Card: Zarządzaj Pracownikami -->
    <rect x="24" y="296" width="312" height="106" rx="14" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
    <circle cx="56" cy="330" r="14" fill="#4f46e5"/>
    <text x="82" y="335" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">Zarządzaj Pracownikami</text>
    <text x="56" y="364" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Zarządzaj Pracownikami, Działami, Rolami</text>
    <rect x="56" y="374" width="70" height="18" rx="9" fill="#312e81"/>
    <text x="91" y="386" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" text-anchor="middle">🎓 Samouczek</text>

    <!-- Menu Section Card: Ustawienia -->
    <rect x="24" y="416" width="312" height="66" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <circle cx="56" cy="449" r="14" fill="#3f3f46"/>
    <text x="82" y="454" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">Ustawienia</text>

    <!-- Home Indicator -->
    <rect x="125" y="714" width="120" height="4" rx="2" fill="#94a3b8"/>
  </g>

  <!-- ================= RIGHT / FOREGROUND PHONE (Employee Punch Clock) ================= -->
  <g transform="matrix(0.96, -0.14, 0.13, 0.97, 360, 230)" filter="url(#softShadow)">
    <!-- Phone Outer Shell -->
    <rect x="0" y="0" width="380" height="780" rx="48" fill="url(#borderSilver)"/>
    <rect x="6" y="6" width="368" height="768" rx="44" fill="#020617"/>
    <!-- Screen -->
    <rect x="14" y="14" width="352" height="752" rx="38" fill="url(#screenDark)"/>
    
    <!-- Dynamic Island -->
    <rect x="140" y="24" width="100" height="26" rx="13" fill="#000000"/>

    <!-- Status Bar / Header -->
    <text x="36" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Antek</text>
    <text x="36" y="66" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">OVH tech</text>
    <text x="330" y="58" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="end">[→ Wyloguj</text>

    <!-- Powiadomienia -->
    <text x="56" y="98" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">🔔 Powiadomienia</text>
    <text x="330" y="98" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="end">Wszystko odczytane</text>

    <!-- Status Box -->
    <rect x="28" y="112" width="324" height="66" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="44" y="134" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Twój status</text>
    <text x="44" y="158" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">W pracy</text>
    <text x="336" y="134" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="end">Dzisiejsza zmiana</text>
    <text x="336" y="154" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="end">08:00–16:00</text>

    <!-- Szybka rejestracja title -->
    <text x="28" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">Szybka rejestracja — jedno kliknięcie</text>

    <!-- 4 BIG COLORFUL ACTION BUTTONS (2x2) -->
    <!-- Green: Wejście -->
    <rect x="28" y="212" width="156" height="52" rx="12" fill="#15803d"/>
    <text x="106" y="244" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">→] Wejście</text>

    <!-- Red: Wyjście -->
    <rect x="196" y="212" width="156" height="52" rx="12" fill="#dc2626"/>
    <text x="274" y="244" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">[→ Wyjście</text>

    <!-- Amber: Przerwa -->
    <rect x="28" y="274" width="156" height="50" rx="12" fill="#d97706"/>
    <text x="106" y="305" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">☕ Przerwa</text>

    <!-- Blue: Służbowe -->
    <rect x="196" y="274" width="156" height="50" rx="12" fill="#2563eb"/>
    <text x="274" y="305" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">💼 Służbowe</text>

    <!-- Gradient Action Banner: Nowy wniosek -->
    <rect x="28" y="334" width="324" height="46" rx="12" fill="url(#cyanGrad)"/>
    <text x="44" y="356" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">📄 Nowy wniosek</text>
    <text x="44" y="370" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">Urlop, zwolnienie, odbiór godzin</text>
    <text x="336" y="362" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" text-anchor="end">›</text>

    <!-- Card: Grafik -->
    <rect x="28" y="390" width="324" height="68" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="50" cy="414" r="10" fill="#1e293b"/>
    <text x="68" y="418" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Grafik</text>
    <text x="50" y="440" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Twoje zaplanowane zmiany dzień po dniu.</text>
    <text x="336" y="424" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" text-anchor="end">›</text>

    <!-- Card: Czas pracy -->
    <rect x="28" y="468" width="324" height="68" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="50" cy="492" r="10" fill="#1e293b"/>
    <text x="68" y="496" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Czas pracy</text>
    <text x="50" y="518" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Twoja karta czasu pracy dzień po dniu wraz z podsumowaniem.</text>
    <text x="336" y="502" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" text-anchor="end">›</text>

    <text x="28" y="556" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8">Twoje konto ma rolę <tspan fill="#e2e8f0" font-weight="600">Pracownik</tspan> — widzisz własne dane.</text>

    <!-- Home Indicator -->
    <rect x="130" y="748" width="120" height="4" rx="2" fill="#94a3b8"/>
  </g>
</svg>
